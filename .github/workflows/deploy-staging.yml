name: Deploy staging

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'CSS/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://arielh.mystagingweb.site
    steps:
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Upload website using FTP
        env:
          FTP_SERVER: lu-shared03.dapanel.net
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import os
          from ftplib import FTP
          from pathlib import Path

          for name in ('FTP_USERNAME', 'FTP_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Add {name} to the staging environment secrets before deploying.')

          source = Path('CSS')
          if not Path('index.html').is_file() or not (source / 'index.html').is_file():
              raise SystemExit('index.html or CSS/index.html is missing.')

          with FTP() as ftp:
              ftp.connect(os.environ['FTP_SERVER'], 21, timeout=60)
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.cwd('/')

              def upload(directory):
                  for item in sorted(directory.iterdir()):
                      if item.is_symlink() or item.name.startswith('.'):
                          continue
                      if item.is_dir():
                          existing = ftp.nlst()
                          if item.name not in [entry.rstrip('/').split('/')[-1] for entry in existing]:
                              ftp.mkd(item.name)
                          ftp.cwd(item.name)
                          upload(item)
                          ftp.cwd('..')
                      elif item.is_file():
                          with item.open('rb') as content:
                              ftp.storbinary('STOR ' + item.name, content)
                          print(f'Uploaded {item.relative_to(source)}')

              # Upload only; unrelated remote files are never deleted.
              # Keep the local CSS folder, but publish it at lowercase /css/.
              existing = ftp.nlst()
              if 'css' not in [entry.rstrip('/').split('/')[-1] for entry in existing]:
                  ftp.mkd('css')
              ftp.cwd('css')
              upload(source)
              ftp.cwd('/')
              with Path('index.html').open('rb') as content:
                  ftp.storbinary('STOR index.html', content)
              print('Uploaded root landing page')
