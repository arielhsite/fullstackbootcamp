name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://arielh.mystagingweb.site
    steps:
      - name: Check out website
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Upload website using FTP
        env:
          FTP_SERVER: lu-shared03.dapanel.net
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import os
          import subprocess
          from ftplib import FTP
          from pathlib import Path

          for name in ('FTP_USERNAME', 'FTP_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit(f'Add {name} to the staging environment secrets before deploying.')

          # Publish tracked static website files while preserving their paths.
          # Configuration, source tooling, hidden files, and credentials stay local.
          extensions = {
              '.html', '.htm', '.css', '.js', '.mjs', '.png', '.jpg', '.jpeg',
              '.gif', '.svg', '.webp', '.avif', '.ico', '.woff', '.woff2',
              '.ttf', '.otf', '.mp3', '.mp4', '.webm', '.ogg', '.wav', '.pdf',
          }
          excluded = {'node_modules', 'vendor', '__pycache__', 'tests', 'scripts'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          uploads = {}
          for name in filter(None, tracked):
              local = Path(name)
              if any(part.startswith('.') or part in excluded for part in local.parts):
                  continue
              if local.suffix.lower() not in extensions:
                  continue
              if not local.is_file() or local.is_symlink():
                  continue
              parts = list(local.parts)
              if parts[0] == 'CSS':
                  parts[0] = 'css'
              remote = '/'.join(parts)
              if remote in uploads:
                  raise SystemExit(f'Duplicate deployment path: {remote}')
              uploads[remote] = local
          if 'index.html' not in uploads:
              raise SystemExit('Root index.html is missing.')

          with FTP() as ftp:
              ftp.connect(os.environ['FTP_SERVER'], 21, timeout=60)
              ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
              ftp.cwd('/')

              # Upload only; unrelated remote files are never deleted.
              for remote, local in sorted(uploads.items()):
                  ftp.cwd('/')
                  parts = remote.split('/')
                  for folder in parts[:-1]:
                      existing = ftp.nlst()
                      if folder not in [entry.rstrip('/').split('/')[-1] for entry in existing]:
                          ftp.mkd(folder)
                      ftp.cwd(folder)
                  with local.open('rb') as content:
                      ftp.storbinary('STOR ' + parts[-1], content)
                  print(f'Uploaded {remote}')
